# Feel-good score weights: the single source of truth (read by fgs.score.load_weights).
#
# composite = sum over factors of weight * z, where z is the factor's z-score across the
# teams in the same (season, week) snapshot. Units: points of opponent/venue-adjusted
# margin per game (next 8 games) per standard deviation of the factor. No intercept.
#
# FROZEN (Phase 6): written by `uv run fgs freeze` on 2026-11-11. Refits are refused; see
# pipeline/PREREGISTRATION.md. Do not hand-edit: the weekly refresh/export never refit (BACK-04).
#
# Procedure: Ridge on the per-snapshot z-scores, unpenalized intercept; alpha chosen by
# choose_alpha (leave-one-season-out CV over 1999-2021, grid {0, 1e-3, 1e-2, 1e-1, 1}*n,
# min pooled SSE): alpha = 0.01*n, n = 12331 snapshots; target = mean adjusted margin over
# the next 8 games. Weights rounded to 2 dp; no clipping, pruning or sign constraint (MODEL-15).
# The 2022-2025 holdout was never read.
#
# Per factor: weight, unrounded fit, sign, and how many of the walk-forward folds
# (test seasons 2003-2021, each refit on earlier seasons) agree with the final sign:
#   elo              2.59  raw +2.5931  sign +  folds 19/19
#   season_record    1.84  raw +1.8410  sign +  folds 19/19
#   last16          -0.21  raw -0.2100  sign -  folds 14/19
#       why -: given Elo, a hot recent record runs ahead of real strength and regresses
#   mov              1.24  raw +1.2407  sign +  folds 19/19
#   sow             -0.56  raw -0.5595  sign -  folds 14/19
#       why -: given Elo and margins, results running ahead of margins regress
#   streak          -0.03  raw -0.0320  sign -  folds 12/19
#       why -: given the rest, a hot streak slightly fades (~0 backtest gain, kept)
#   luck            -0.35  raw -0.3511  sign -  folds 19/19
#       why -: close-game wins and losses are mostly coin flips, so they even out
#   epa_traj        -0.33  raw -0.3274  sign -  folds 19/19
#       why -: given the rest, an efficiency upswing slightly fades (~0 backtest gain, kept)
#   qb_trend         0.63  raw +0.6315  sign +  folds 19/19
#   vs_exp          -1.22  raw -1.2213  sign -  folds 18/19
#       why -: ~ season_record minus preseason expectation; read the pair together (corr 0.92); beating expectations tends to fade
#   po_trend        -0.05  raw -0.0513  sign -  folds 17/19
#       why -: ~0; Elo's 3-week change already carries it (corr 0.70); kept so the weight is on record
#
# Full walk-forward evidence (CIs, Brier, per-factor deltas): pipeline/FREEZE_RESULT.json.
frozen: true
fit_seasons: [1999, 2021]
target: adjusted_margin_n8
alpha: 0.01  # multiplied by n inside ridge_fit
n: 12331
fitted_at: "2026-11-11"
weights:  # read by score.load_weights; must stay {factor: number}
  elo: 2.59
  season_record: 1.84
  last16: -0.21
  mov: 1.24
  sow: -0.56
  streak: -0.03
  luck: -0.35
  epa_traj: -0.33
  qb_trend: 0.63
  vs_exp: -1.22
  po_trend: -0.05
fit:  # per-factor evidence (ignored by load_weights)
  elo: {raw: 2.593074, sign: "+", fold_sign: [19, 19]}
  season_record: {raw: 1.841025, sign: "+", fold_sign: [19, 19]}
  last16: {raw: -0.210033, sign: "-", fold_sign: [14, 19]}
  mov: {raw: 1.240667, sign: "+", fold_sign: [19, 19]}
  sow: {raw: -0.559506, sign: "-", fold_sign: [14, 19]}
  streak: {raw: -0.031969, sign: "-", fold_sign: [12, 19]}
  luck: {raw: -0.351085, sign: "-", fold_sign: [19, 19]}
  epa_traj: {raw: -0.327402, sign: "-", fold_sign: [19, 19]}
  qb_trend: {raw: 0.631521, sign: "+", fold_sign: [19, 19]}
  vs_exp: {raw: -1.221338, sign: "-", fold_sign: [18, 19]}
  po_trend: {raw: -0.051305, sign: "-", fold_sign: [17, 19]}

# ---------------------------------------------------------------------------------------------
# OFFSEASON draft term (Phase 7, MODEL-16): separate from the frozen in-season weights above,
# which it never changes (load_weights reads only `weights:`; fgs.score.load_offseason reads this).
# Fit with `uv run fgs backtest --draft` on 2026-11-11: residual on the FROZEN composite
# (y8 - composite ~ 1 + decay(week) * draft_z, weeks 0-3), surplus z from drafts 2000-2021
# (1999 not derivable), walk-forward test seasons 2003-2021. The evidence is training-only
# walk-forward: the 2022-2025 holdout was consumed by Phase 6, so there is no fresh holdout.
# Gate: weight = fitted (2 dp) only if fitted > 0 AND >= 60% of folds share its sign AND
# wk0 ΔSpearman (N=8) > 0; otherwise weight 0 and display only (surplus shown, not scored).
# Verdict: gate failed: fitted -0.28, 8/19 folds share its sign, wk0 ΔSpearman +0.0003
# -> weight 0, display only. Re-run 2026-11-11 after the CR-01 alignment fix (forfeits only from
# draft.FORFEITS, no DP-invented forfeits): was fitted -0.2828 / 8/19 / wk0 Δ +0.0002. The
# walk-forward folds now cap surplus with winsor bounds from earlier drafts only (WR-02); the
# winsor below (all 2000-2021 drafts) is used by the final fit and the shipped z.
offseason:
  draft:
    weight: 0.00
    display_only: true
    chart: stuart
    winsor: [-17.29, 16.19]  # p5/p95 of 2000-2021 surplus
    decay: linear_to0_by_wk4  # weeks 0,1,2,3 -> 1, .75, .5, .25
    fit_seasons: 2000-2021
    test_seasons: 2003-2021
    fitted: -0.2826
    fold_sign: "8/19"
    delta_wk0: 0.0003
    evidence: training-only walk-forward (no fresh holdout)
